name: Auto Build and Release PyInstaller EXEs

on:
  push:
    branches:
      - main  # Adjust this to your primary branch (e.g., master)

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Scan and Build All Inclusive Python Files
      shell: powershell
      run: |
        # Change 1: Scan the ENTIRE repository recursively for all .py files, ignoring the hidden .github folder
        $allPythonFiles = Get-ChildItem -Path . -Filter *.py -Recurse | 
                          Where-Object { $_.FullName -notlike "*\.github\*" -and $_.FullName -notlike "*\dist\*" -and $_.FullName -notlike "*\build\*" }

        if (-not $allPythonFiles) {
            Write-Host "No Python files found in the repository."
            exit 0
        }

        New-Item -ItemType Directory -Force -Path .\dist_exes

        foreach ($fileItem in $allPythonFiles) {
            $file = $fileItem.FullName
            Write-Host "Processing file: $file"

            try {
                $process = Start-Process python -ArgumentList $file -NoNewWindow -PassThru
                Start-Sleep -Seconds 5
                
                if (-not $process.HasExited) {
                    Stop-Process $process.Id -Force
                    Write-Host "$file passed the execution check."
                } else {
                    if ($process.ExitCode -ne 0) {
                        Write-Warning "Skipping $file: Script crashed during test execution."
                        continue
                    }
                    Write-Warning "Skipping $file: Script exited immediately (likely non-GUI)."
                    continue
                }
            } catch {
                Write-Warning "Skipping $file: Failed to run pre-compilation check."
                continue
            }

            Write-Host "Compiling $file with PyInstaller..."
            
            # Change 2: Dynamically look for an 'assets' folder in the same folder as the script
            $scriptDir = Split-Path -Parent $file
            $assetFolder = Join-Path $scriptDir "assets"
            
            if (Test-Path $assetFolder) {
                Write-Host "Found local assets folder at $assetFolder, bundling into EXE..."
                pyinstaller --onefile --noconsole --add-data "$assetFolder;assets" $file
            } else {
                pyinstaller --windowed --onefile $file
            }

            $exeName = [System.IO.Path]::GetFileNameWithoutExtension($file) + ".exe"
            $exePath = ".\dist\$exeName"

            if (Test-Path $exePath) {
                Write-Host "Successfully compiled $exeName"
                Move-Item -Path $exePath -Destination .\dist_exes\ -Force
            } else {
                Write-Warning "Skipping $file: PyInstaller failed."
            }
        }

        $exeCount = (Get-ChildItem .\dist_exes\ -Filter *.exe).Count
        echo "EXE_COUNT=$exeCount" >> $env:GITHUB_ENV

    - name: Create Release and Upload Assets
      if: env.EXE_COUNT != '0'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.sha }}
        name: Automated Release - Build ${{ github.sha }}
        body: |
          Automated release generated from commit ${{ github.sha }}.
          This release contains ALL successfully built GUI executables found across the repository.
        draft: false
        prerelease: false
        files: .\dist_exes\*.exe

